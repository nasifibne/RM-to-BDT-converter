<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM to BDT Converter</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#14171f;--muted:#6b7280;--accent:#0f766e;--line:#e2e5ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--text:#eef0f4;--muted:#9aa1ad;--accent:#2dd4bf;--line:#2b303a}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--text:#eef0f4;--muted:#9aa1ad;--accent:#2dd4bf;--line:#2b303a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px;height:fit-content}
h1{font-size:20px;margin:0 0 18px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.row span{font-weight:600;color:var(--muted);min-width:44px}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:24px;padding:14px 0;outline:none;font-family:inherit}
.rate input{font-size:16px;padding:10px 0}
button{width:100%;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:15px;cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">RM → BDT Converter</h1>

  <label for="from" id="fromLabel">Malaysian Ringgit</label>
  <div class="row"><span id="fromCode">RM</span><input id="from" type="number" inputmode="decimal" value="100" min="0"></div>

  <label for="to" id="toLabel">Bangladeshi Taka</label>
  <div class="row"><span id="toCode">৳</span><input id="to" type="number" inputmode="decimal"></div>

  <label for="rate">Rate: 1 RM = ? BDT (edit to match today's rate)</label>
  <div class="row rate"><span>1 RM =</span><input id="rate" type="number" inputmode="decimal" step="0.0001" value="30.12"><span style="text-align:right">BDT</span></div>

  <button id="swap">⇄ Swap direction</button>

  <div class="note">Default rate is an approximate mid-market reference and may be out of date. Check Google, Wise or XE for the live rate and type it in above. Banks and money changers usually give a slightly lower rate.</div>
</div>

<script>
var mode = 'myr'; // 'myr' = RM -> BDT, 'bdt' = BDT -> RM
var from = document.getElementById('from');
var to = document.getElementById('to');
var rate = document.getElementById('rate');

function fmt(n){ return isFinite(n) ? (Math.round(n*100)/100).toString() : ''; }

function calc(){
  var r = parseFloat(rate.value), v = parseFloat(from.value);
  if (isNaN(r) || isNaN(v)) { to.value = ''; return; }
  to.value = fmt(mode === 'myr' ? v * r : v / r);
}
function calcReverse(){
  var r = parseFloat(rate.value), v = parseFloat(to.value);
  if (isNaN(r) || isNaN(v)) { from.value = ''; return; }
  from.value = fmt(mode === 'myr' ? v / r : v * r);
}
function labels(){
  var m = mode === 'myr';
  document.getElementById('title').textContent = m ? 'RM → BDT Converter' : 'BDT → RM Converter';
  document.getElementById('fromLabel').textContent = m ? 'Malaysian Ringgit' : 'Bangladeshi Taka';
  document.getElementById('toLabel').textContent = m ? 'Bangladeshi Taka' : 'Malaysian Ringgit';
  document.getElementById('fromCode').textContent = m ? 'RM' : '৳';
  document.getElementById('toCode').textContent = m ? '৳' : 'RM';
}

from.addEventListener('input', calc);
to.addEventListener('input', calcReverse);
rate.addEventListener('input', calc);
document.getElementById('swap').addEventListener('click', function(){
  mode = mode === 'myr' ? 'bdt' : 'myr';
  var t = from.value; from.value = to.value; to.value = t;
  labels();
});

labels();
calc();
</script>
</body>
</html>
